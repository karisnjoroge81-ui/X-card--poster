<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Poster</title>
<style>
:root{--bg:#10141c;--panel:#171c27;--line:#2a3142;--text:#e8ecf4;--dim:#8d97ad;--accent:#6ea8fe;--ok:#5fd0a0;--bad:#ff7b7b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 16px}
h2{font-size:16px;margin:28px 0 10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);margin:14px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#08101f;font:inherit;font-weight:600}
button:disabled{opacity:.5}
.msg{margin-top:12px;font-size:14px;color:var(--dim)}
.msg.err{color:var(--bad)}
.post{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
.post:first-child{border-top:0;padding-top:0}
.post b{display:block;font-size:15px;margin-bottom:2px}
.s-posted{color:var(--ok)}.s-failed{color:var(--bad)}.s-working{color:var(--accent)}
.post a{color:var(--accent)}
.post .e{color:var(--bad);word-break:break-word;margin-top:4px}
#login{display:none}
</style>
</head>
<body>
<h1>Card Poster</h1>

<div id="login" class="panel">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="pwBtn">Open</button>
  <div class="msg err" id="pwErr"></div>
</div>

<div id="app" hidden>
  <div class="msg err" id="health"></div>
  <div class="panel">
    <label for="text">Post text <span id="tc">0/280</span></label>
    <textarea id="text" maxlength="280" placeholder="What do you want to say?"></textarea>
    <label for="url">Website URL</label>
    <input id="url" type="url" inputmode="url" placeholder="https://example.com/article">
    <label for="head">Headline <span id="hc">0/70</span></label>
    <input id="head" maxlength="70" placeholder="Enter a headline">
    <label for="vid">Square video (1:1)</label>
    <input id="vid" type="file" accept="video/mp4,video/quicktime">
    <button id="go">Post website card</button>
    <div class="msg" id="msg"></div>
  </div>

  <h2>Posts</h2>
  <div class="panel" id="list"><div class="msg">No posts yet.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let pw = localStorage.getItem('pw') || '';
const api = (p, o = {}) => fetch(p, { ...o, headers: { 'x-password': pw, ...(o.headers || {}) } });

async function start() {
  const r = await api('/api/health');
  if (r.status === 401) { $('app').hidden = true; $('login').style.display = 'block'; return; }
  $('login').style.display = 'none'; $('app').hidden = false;
  const h = await r.json();
  $('health').textContent = h.missing.length ? 'Missing settings on the server: ' + h.missing.join(', ') : '';
  load(); setInterval(load, 3000);
}
$('pwBtn').onclick = async () => {
  pw = $('pw').value; localStorage.setItem('pw', pw);
  const r = await api('/api/health');
  if (r.status === 401) { $('pwErr').textContent = 'Wrong password'; return; }
  $('pwErr').textContent = ''; start();
};
$('text').oninput = () => $('tc').textContent = $('text').value.length + '/280';
$('head').oninput = () => $('hc').textContent = $('head').value.length + '/70';

$('go').onclick = async () => {
  const f = $('vid').files[0], msg = $('msg');
  msg.className = 'msg'; msg.textContent = '';
  if (!f) { msg.className = 'msg err'; msg.textContent = 'Choose a video.'; return; }
  const fd = new FormData();
  fd.append('text', $('text').value); fd.append('url', $('url').value);
  fd.append('headline', $('head').value); fd.append('video', f);
  $('go').disabled = true; msg.textContent = 'Sending video to the server...';
  try {
    const r = await api('/api/post', { method: 'POST', body: fd });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Failed');
    msg.textContent = 'Started. Watch the status below.';
    $('text').value = ''; $('head').value = ''; $('vid').value = '';
    $('tc').textContent = '0/280'; $('hc').textContent = '0/70';
    load();
  } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
  $('go').disabled = false;
};

async function load() {
  const r = await api('/api/posts'); if (!r.ok) return;
  const posts = await r.json(), box = $('list');
  if (!posts.length) return;
  box.innerHTML = '';
  for (const p of posts) {
    const d = document.createElement('div'); d.className = 'post';
    const t = document.createElement('b'); t.textContent = p.headline; d.append(t);
    const s = document.createElement('div'); s.className = 's-' + p.status; s.textContent = p.step; d.append(s);
    if (p.link) { const a = document.createElement('a'); a.href = p.link; a.target = '_blank'; a.textContent = 'Open post'; d.append(a); }
    if (p.error) { const e = document.createElement('div'); e.className = 'e'; e.textContent = p.error; d.append(e); }
    box.append(d);
  }
}
start();
</script>
</body>
</html>
